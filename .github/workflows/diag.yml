name: Check live wait feeds
on:
  push:
    paths:
      - ".github/workflows/diag.yml"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feeds the app uses
        run: |
          mkdir -p diag
          O="-H Origin:https://ratherbhunting211.github.io"
          curl -sS -m 60 -D diag/destinations.headers $O https://api.themeparks.wiki/v1/destinations -o diag/destinations.json || echo "destinations failed" > diag/destinations.err
          ID=$(python3 -c "import json;d=json.load(open('diag/destinations.json'));u=[x for x in d['destinations'] if 'niversal' in x['name'] and 'rlando' in x['name']][0];print([p['id'] for p in u['parks'] if 'Studios Florida' in p['name']][0])" 2>diag/id.err || true)
          echo "$ID" > diag/usf-id.txt
          curl -sS -m 60 -D diag/live-usf.headers $O "https://api.themeparks.wiki/v1/entity/$ID/live" -o diag/live-usf.json || echo "live failed" > diag/live.err
          curl -sS -m 60 -D diag/qt.headers $O https://queue-times.com/parks/65/queue_times.json -o diag/qt-usf.json || echo "qt failed" > diag/qt.err
          ls -la diag
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag
          git commit -m "Live feed check results" || true
          git pull --rebase origin main
          git push origin HEAD:main
